<!DOCTYPE html>
<html lang="en" data-theme="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anuraj Valliyil — Test Architect</title>
<meta name="description" content="Anuraj Valliyil, Test Architect with 13+ years in QA and AI-driven test automation. Interactive terminal portfolio.">
<meta name="theme-color" content="#0f1218">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✓</text></svg>">
<style>
:root{--bg:#0f1218;--panel:#151a23;--fg:#cfd6e4;--dim:#6b7385;--ac:#6ee7d0;--ac2:#f2c26b;--err:#ff7b8a;--line:#232b38}
[data-theme=amber]{--bg:#14100a;--panel:#1b150d;--fg:#e6d5b8;--dim:#8a7757;--ac:#f2a83b;--ac2:#f7d488;--line:#2e2416}
[data-theme=violet]{--bg:#110e18;--panel:#181423;--fg:#d9d3ea;--dim:#7a7192;--ac:#b69cff;--ac2:#ffc48a;--line:#2a2338}
[data-theme=rose]{--bg:#170f12;--panel:#1f1519;--fg:#ecd8dc;--dim:#8f6f77;--ac:#ff8fa3;--ac2:#ffd08a;--line:#33222a}
[data-theme=paper]{--bg:#f6f4ef;--panel:#ebe8e0;--fg:#262a33;--dim:#7d8290;--ac:#0b7a6b;--ac2:#a35d00;--err:#c2334a;--line:#d8d4c8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.7 "JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none}#gl.on{opacity:.5}
#win{position:relative;z-index:1;max-width:920px;height:100%;margin:0 auto;display:flex;flex-direction:column;border-inline:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent)}
#ld{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .45s}#ld.off{opacity:0;pointer-events:none}#ld pre{font:inherit;white-space:pre;min-width:min(400px,88vw)}
@media(min-width:1100px){#gl.on{opacity:1}#win{margin:0 0 0 4vw;width:min(56vw,860px);max-width:none;border:1px solid var(--line)}}
#bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--dim);font-size:12px}
#bar i{width:10px;height:10px;border-radius:50%;background:var(--line);border:1px solid var(--dim)}
#bar span{flex:1;text-align:center}#sw{display:flex;gap:8px}#sw button{width:14px;height:14px;border-radius:50%;border:1px solid var(--dim);padding:0;cursor:pointer}#sw button[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:2px}#sw button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#out{flex:1;overflow-y:auto;padding:16px 16px 8px;scroll-behavior:auto;overscroll-behavior:contain}
#out>div{max-width:74ch;white-space:pre-wrap;word-break:break-word;min-height:1.6em}
.dim{color:var(--dim)}.ac{color:var(--ac)}.ac2{color:var(--ac2)}.err{color:var(--err)}.b{font-weight:700}
.ok{color:var(--ac)}
a{color:var(--ac);text-decoration:underline;text-underline-offset:3px}
a:hover,a:focus-visible{background:var(--ac);color:var(--bg);outline:none}
.cmd{color:var(--ac2);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.cmd:hover,.cmd:focus-visible{background:var(--ac2);color:var(--bg);outline:none}
.blk{white-space:normal!important;display:grid;grid-template-columns:auto 1fr;gap:0 14px;margin:2px 0}
.blk>b{color:var(--ac2);font-weight:400;white-space:nowrap}
.tag{display:inline-block;border:1px solid var(--line);padding:0 8px;margin:2px 4px 2px 0;border-radius:3px;white-space:nowrap}
.art{color:var(--ac);line-height:1;font-size:clamp(8px,3vw,15px);white-space:pre}.art+.art{margin-top:.9em}
.bar{display:inline-block;height:.7em;background:var(--ac);vertical-align:baseline;margin-right:6px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:6px 14px;border-top:1px solid var(--line);scrollbar-width:none}
#chips button{flex:none;font:inherit;font-size:12px;color:var(--dim);background:none;border:1px solid var(--line);border-radius:3px;padding:2px 10px;cursor:pointer}
#chips button:hover,#chips button:focus-visible{color:var(--bg);background:var(--ac);border-color:var(--ac);outline:none}
#in{display:flex;gap:8px;padding:8px 14px 12px;background:var(--panel);border-top:1px solid var(--line)}
#in label{color:var(--ac);white-space:nowrap}
#in label b{color:var(--ac2);font-weight:400}
#cmd{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;caret-color:var(--ac)}
.sh{color:var(--ac2);margin:12px 0 6px;font-weight:700}.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;white-space:normal}.sk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px}.ti{position:relative;flex:none;width:36px;height:36px;border-radius:6px;background:#eef1f5;color:#20242c;font-size:11px;display:grid;place-items:center;overflow:hidden}.ti svg{position:absolute;inset:0;width:100%;height:100%;padding:6px;background:#eef1f5;box-sizing:border-box}.sn{display:block;line-height:1.3}.lv{display:flex;gap:3px;align-items:center;margin-top:4px}.lv i{width:14px;height:4px;border-radius:2px;background:var(--line)}.lv i.on{background:var(--ac)}.lv em{font-style:normal;font-size:11px;color:var(--dim);margin-left:4px}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes rise{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 60%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.tl{position:relative;padding-left:26px;margin:10px 0;white-space:normal}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--ac);opacity:.55;transform-origin:top;animation:draw 1.8s linear both}
.te{position:relative;padding-bottom:18px;opacity:0;animation:rise .55s ease-out forwards;animation-delay:calc(var(--i)*.4s + .2s)}
.te:last-child{padding-bottom:0}
.dot{position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ac)}
.te:first-child .dot{background:var(--ac);animation:pulse 2s infinite}
.yr{color:var(--ac2);font-weight:700}.ro{color:var(--ac);font-weight:700;margin:1px 0 4px}.te p{color:var(--fg)}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;white-space:normal;margin-top:10px}
.ic{border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:6px;padding:10px 12px}
.ic h4{font:inherit;font-weight:700;color:var(--ac2);margin-bottom:4px}.ic p{line-height:1.55}
@media(prefers-reduced-motion:reduce){.tl::before,.te,.dot{animation:none!important}.te{opacity:1}}
::selection{background:var(--ac);color:var(--bg)}
@media(max-width:560px){body{font-size:13.5px}#in label .h{display:none}.blk{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

function scene(){
  const T=window.THREE;if(!T)return;
  const cv=$('#gl'),R=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true,powerPreference:'low-power'});
  R.setPixelRatio(Math.min(devicePixelRatio,2));
  const S=new T.Scene(),cam=new T.PerspectiveCamera(45,1,.1,50);cam.position.z=6;
  const g=new T.Group();S.add(g);
  const geo=new T.IcosahedronGeometry(1.9,2),a=geo.attributes.position,seen=new Set(),P=[];
  for(let i=0;i<a.count;i++){const k=a.getX(i).toFixed(3)+a.getY(i).toFixed(3)+a.getZ(i).toFixed(3);if(!seen.has(k)){seen.add(k);P.push(a.getX(i),a.getY(i),a.getZ(i))}}
  const n=P.length/3,col=new Float32Array(P.length);
  const pg=new T.BufferGeometry();pg.setAttribute('position',new T.Float32BufferAttribute(P,3));pg.setAttribute('color',new T.BufferAttribute(col,3));
  const pts=new T.Points(pg,new T.PointsMaterial({size:.075,vertexColors:true,sizeAttenuation:true}));
  const lm=new T.LineBasicMaterial({transparent:true,opacity:.22});
  g.add(pts,new T.LineSegments(new T.WireframeGeometry(geo),lm));
  const ring=[];for(let i=0;i<128;i++){const t=i/128*Math.PI*2;ring.push(Math.cos(t)*2.7,0,Math.sin(t)*2.7)}
  const rg=new T.BufferGeometry();rg.setAttribute('position',new T.Float32BufferAttribute(ring,3));
  const rm=new T.LineBasicMaterial({transparent:true,opacity:.35}),rl=new T.LineLoop(rg,rm);rl.rotation.set(.5,0,.35);g.add(rl);
  const mg=new T.BufferGeometry();mg.setAttribute('position',new T.Float32BufferAttribute([2.7,0,0],3));
  const mm=new T.PointsMaterial({size:.16,sizeAttenuation:true}),mk=new T.Points(mg,mm);rl.add(mk);
  const ac=new T.Color(),dm=new T.Color();
  recolor=()=>{const s=getComputedStyle(root);ac.set(s.getPropertyValue('--ac').trim());dm.set(s.getPropertyValue('--dim').trim());lm.color.copy(dm);rm.color.copy(ac);mm.color.copy(ac);if(still)draw(3)};
  recolor();
  let mx=0,my=0,sx=0,sy=0,wide=true;
  const size=()=>{const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();wide=w>=1100;
    const vw=2*Math.tan(cam.fov*Math.PI/360)*6*cam.aspect;g.position.x=wide?(.74-.5)*vw:0;g.scale.setScalar(wide?1:.72);if(still)draw(3)};
  addEventListener('resize',size);size();
  addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
  function draw(t){
    sx+=(mx-sx)*.05;sy+=(my-sy)*.05;
    g.rotation.y=t*.14+sx*.8;g.rotation.x=.22+sy*.5;rl.rotation.y=t*.4;mk.rotation.y=-t*.9;
    const dx=Math.cos(t*.6),dy=Math.sin(t*.45),dz=Math.sin(t*.6),l=Math.hypot(dx,dy,dz),c=Math.sin(t*.8);
    for(let i=0;i<n;i++){const v=(P[i*3]*dx+P[i*3+1]*dy+P[i*3+2]*dz)/(l*1.9),w=Math.max(0,1-Math.abs(v-c)*3.4);
      col[i*3]=dm.r+(ac.r-dm.r)*w;col[i*3+1]=dm.g+(ac.g-dm.g)*w;col[i*3+2]=dm.b+(ac.b-dm.b)*w}
    pg.attributes.color.needsUpdate=true;R.render(S,cam)}
  if(still)draw(3);else{const loop=t=>{draw(t*.001);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
  cv.classList.add('on');
}

const TH=['teal','amber','violet','rose','paper'],SW={teal:'#6ee7d0',amber:'#f2a83b',violet:'#b69cff',rose:'#ff8fa3',paper:'#f6f4ef'};
function setTheme(t){root.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}recolor();document.querySelectorAll('#sw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))}
const G={A:[' ███ ','█   █','█████','█   █','█   █'],N:['█   █','██  █','█ █ █','█  ██','█   █'],U:['█   █','█   █','█   █','█   █',' ███ '],R:['████ ','█   █','████ ','█  █ ','█   █'],J:['  ███','    █','    █','█   █',' ███ '],V:['█   █','█   █','█   █',' █ █ ','  █  '],L:['█    ','█    ','█    ','█    ','█████'],I:['█████','  █  ','  █  ','  █  ','█████'],Y:['█   █',' █ █ ','  █  ','  █  ','  █  ']};
const word=w=>[0,1,2,3,4].map(r=>[...w].map(c=>G[c][r]).join(' ')).join('\n');

async function loader(){
  const steps=['mounting terminal shell','loading profile data','indexing experience timeline','warming up qa toolkit','connecting mcp session','compiling 3d scene'];
  const three=loadThree(),N=steps.length;let lines=[],p=0;
  const draw=(x='')=>{ldt.innerHTML=`<span class="ac b">ANURAJ VALLIYIL</span>\n<span class="dim">portfolio://terminal  v2.0</span>\n\n`+lines.join('\n')+`\n\n<span class="ac">${bar(p)}</span> ${String(p).padStart(3)}%${x}`};
  draw();if(!still)await sleep(350);
  for(let i=0;i<N;i++){
    lines.push(`<span class="dim">[ .. ]</span> ${steps[i]}`);
    const tgt=i<N-1?Math.round((i+1)*94/N):96;
    while(p<tgt){p++;draw();if(!still)await sleep(14)}
    if(i==N-1)await three;
    lines[i]=`<span class="ok">[ ok ]</span> ${steps[i]}`;draw();
    if(!still)await sleep(150);
  }
  while(p<100){p++;draw();if(!still)await sleep(20)}
  lines.push('<span class="ac b">system ready.</span>');draw();
  scene();
  if(!still)await sleep(600);
  ld.classList.add('off');setTimeout(()=>ld.remove(),500);
}

async function boot(){
  busy=true;
  print(word('ANURAJ'),'art');print(word('VALLIYIL'),'art');
  print('<span class="dim">Test Architect · 13+ years · AI-driven testing</span>\n');
  print(`Type ${C('help')} to see commands, or start with ${C('about')}. Change colors with the dots above or ${C('theme')}.\n`);
  busy=false;inp.focus({preventScroll:true});
}

const hist=[];let hi=0;
function exec(raw){
  const line=raw.trim();
  print(`<span class="ac">anuraj</span><span class="dim">@qa-lab</span>:<span class="ac2">~</span>$ ${line.replace(/</g,'&lt;')}`);
  if(!line)return;
  hist.push(line);hi=hist.length;
  const [c,...a]=line.split(/\s+/),f=CMDS[c.toLowerCase()];
  if(!f){print(`<span class="err">${c.replace(/</g,'&lt;')}: command not found.</span> Try ${C('help')}.`);return}
  const r=f(a);if(r!=null)print(r+'\n')
}

inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){if(busy)return;const v=inp.value;inp.value='';exec(v)}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)inp.value=hist[--hi]}
  else if(e.key==='ArrowDown'){e.preventDefault();inp.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'')}
  else if(e.key==='Tab'){e.preventDefault();const v=inp.value.toLowerCase();if(!v)return;const m=Object.keys(CMDS).filter(k=>k.startsWith(v));if(m.length===1)inp.value=m[0];else if(m.length>1)print(m.join('  '),'dim')}
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();CMDS.clear()}
});
function fire(el){const c=el.dataset.c;if(!c||busy)return;exec(c.replace(/\.txt$/,'').replace(/^/,c.endsWith('.txt')?'cat ':''))}
out.addEventListener('click',e=>{const t=e.target.closest('.cmd');if(t)fire(t);else if(!getSelection().toString())inp.focus({preventScroll:true})});
out.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('cmd'))fire(e.target)});
$('#chips').innerHTML=['about','experience','skills','impact','contact','help'].map(c=>`<button data-c="${c}">${c}</button>`).join('');
$('#chips').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!busy){exec(b.dataset.c);if(matchMedia('(hover:hover)').matches)inp.focus()}});
$('#sw').innerHTML=TH.map(t=>`<button data-t="${t}" aria-label="Theme ${t}" title="${t}" style="background:${SW[t]}"></button>`).join('');$('#sw').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t)});
let st='teal';try{const t=localStorage.getItem('th');if(TH.includes(t))st=t}catch(e){}setTheme(st);
loader().then(boot);
})();
</script>
